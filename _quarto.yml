project:
  type: website
  output-dir: docs

freeze: auto

website:
  title: "Angelo Maria Sabatini"
  site-url: https://amsabatini.netlify.app
  description: "The personal blog of Angelo Maria Sabatini"
  navbar:
    right:
      - text: Blog
        href: blog.qmd
      - text: Archive
        href: archive.qmd
      - icon: github
        href: https://github.com/angelosabatini
      - icon: rss
        href: /blog.xml
        aria-label: RSS feed
  google-analytics: G-G7T7XXSXKG
  cookie-consent: true

